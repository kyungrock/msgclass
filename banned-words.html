  <main class="page">
    <a class="back-link" href="reviews.html">← 후기 목록</a>
    <div class="page-hero">
      <h1>금지어 관리</h1>
    </div>

    <p class="page-desc">콤마(,)로 구분해 여러 금지어를 한 번에 등록·수정할 수 있습니다. 예: 야구,농구,수영,섹스</p>

    <form class="banned-form" id="banned-form">
      <label>
        금지어 추가 (콤마로 여러 개)
        <input type="text" id="banned-input" placeholder="예: 야구,농구,수영,섹스" required />
      </label>
      <button type="submit" class="btn btn-primary">추가</button>
    </form>

    <div class="banned-bulk">
      <label>
        금지어 전체 (콤마로 관리)
        <textarea id="banned-text" rows="6" placeholder="야구,농구,수영,섹스"></textarea>
      </label>
      <button type="button" class="btn btn-primary" id="banned-save-text">전체 저장</button>
    </div>

    <div class="board-toolbar">
      <span class="board-count">전체 <span id="banned-count">0</span></span>
    </div>

    <ul class="banned-list" id="banned-list"></ul>
  </main>
