<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>로그인 | GN CLASS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-en">강남 비너스</span>
        <span class="logo-ko">msg1000.com</span>
      </a>

      <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="attendance.html">출근부</a>
        <a href="reviews.html">후기</a>
        <a href="profile.html">프로필</a>
        <a href="notice.html">공지사항</a>
        <a href="login.html" class="is-active">로그인</a>
        <a href="signup.html">회원가입</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="page-hero">
      <h1>로그인</h1>
    </div>

    <form class="auth-form" id="login-form">
      <label>
        아이디
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label>
        비밀번호
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn btn-primary auth-submit">로그인</button>
      <p class="auth-switch">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
      <p class="auth-switch" id="admin-status"></p>
      <p class="auth-switch">
        <a href="index.html?admin=1" id="admin-on">관리 모드 켜기</a>
        ·
        <a href="index.html?admin=0" id="admin-off">관리 모드 끄기</a>
      </p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; msg1000 강남 비너스</p>
  </footer>

  <script src="js/admin-mode.js?v=20260811-8"></script>
  <script src="js/main.js?v=20260811-8"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      setAdminMode(true);
      applyAdminVisibility();
      window.location.href = "index.html";
    });

    const statusEl = document.getElementById("admin-status");
    if (statusEl) {
      statusEl.textContent = isAdminMode()
        ? "현재: 관리 모드 ON (등록/수정/삭제 보임)"
        : "현재: 공개 모드 (등록/수정/삭제 숨김)";
    }
  </script>
</body>
</html>
